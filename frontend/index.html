<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Recursos visuais do chat e componentes comuns da navegação. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="/frontend/css/style.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Chat Roblox Family</title>
</head>

<body>
    <!-- Navegação pública; o painel valida a permissão administrativa no servidor. -->
    <nav class="navbar navbar-inverse">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#myNavbar">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <!-- Preserva o SVG e a animação CSS original do logotipo. -->
                <div class="wrapper">
                    <svg>
                        <text x="50%" y="50%" dy=".35em" text-anchor="middle">
                            Roblox Family-x4
                        </text>
                    </svg>
                </div>
            </div>
            <div class="collapse navbar-collapse" id="myNavbar">
                <ul class="nav navbar-nav">
                    <li><a href="/index.html">Página Inicial</a></li>
                    <li><a href="/sobre.html">Sobre Nós</a></li>
                    <li><a href="/frontend/index.html">Bate Papo</a></li>
                    <li><a href="/galeria.html">Nossos Vídeos</a></li>
                    <li><a href="/contato.html">Fale Conosco</a></li>
                    <li><a href="/admin/index.html">Administração</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Fim da navegação. -->

    <!-- Login e cadastro usam endpoints PHP e uma sessão persistida no servidor. -->
    <section class="chat-container">
        <section class="login">
            <h2 class="auth-title">Entrar no bate-papo</h2>
            <form class="login-form">
                <label for="auth-email">E-mail</label>
                <input id="auth-email" name="email" type="email" class="login-input" placeholder="seu@email.com" maxlength="254" autocomplete="email" required>
                <label for="auth-password">Senha</label>
                <input id="auth-password" name="password" type="password" class="login-input" placeholder="Sua senha" minlength="10" maxlength="72" autocomplete="current-password" required>
                <button type="submit" class="login-button">Entrar</button>
            </form>
            <form class="register-form" hidden>
                <label for="register-name">Nome no chat</label>
                <input id="register-name" name="username" type="text" class="login-input" maxlength="24" minlength="3" autocomplete="nickname" required>
                <label for="register-email">E-mail</label>
                <input id="register-email" name="email" type="email" class="login-input" maxlength="254" autocomplete="email" required>
                <label for="register-password">Senha (10 a 72 bytes)</label>
                <input id="register-password" name="password" type="password" class="login-input" minlength="10" maxlength="72" autocomplete="new-password" required>
                <button type="submit" class="login-button">Criar conta</button>
            </form>
            <button type="button" class="auth-switch">Criar uma conta</button>
            <p class="auth-message" role="status" aria-live="polite"></p>
        </section>

        <!-- A área do chat só aparece após a autenticação ser confirmada. -->
        <section class="chat">
            <header class="chat-header">
                <p class="chat-user"></p>
                <button type="button" class="logout-button">Sair</button>
            </header>
            <section class="chat-messages">
            </section>
            <form class="chat-form">
                <input type="text" class="chat-input" placeholder="Digite aqui sua mensagem" maxlength="500" required>
                <button type="submit" class="chat-button" aria-label="Enviar mensagem"><span class="material-symbols-outlined">
                        send
                    </span></button>
            </form>
        </section>
        <!-- Mensagens de conexão e moderação são anunciadas também por leitores de tela. -->
        <p class="chat-status" role="status" aria-live="polite"></p>
    </section>

    <script src="/frontend/js/script.js"></script>
</body>

</html>
